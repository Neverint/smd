[package]
name = "smd"
description = "Scrub My Disks: free, open-source PC care for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue 8519 on Windows).
name = "smd_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
smd-core.workspace = true

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
