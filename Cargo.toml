[workspace]
resolver = "3"
members = ["src-tauri", "crates/core", "crates/win"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Neverint"]
repository = "https://github.com/Neverint/smd"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
rayon = "1.12"
tempfile = "3"
smd-core = { path = "crates/core" }
smd-win = { path = "crates/win" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
